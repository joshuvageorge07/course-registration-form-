<!DOCTYPE html>
<html>
<head>
    <title>Course Registration</title>
</head>
<body>
    <h2>Course Registration Form</h2>
    <form id="myform">
        Name:
        <input type="text" id="name" placeholder="Enter name"
               pattern="[A-Za-z ]{3,}" required><br><br>
        Email:
        <input type="email" id="email" required><br><br>
        Mobile:
        <input type="tel" id="mobile" pattern="[0-9]{10}"
               placeholder="10 digit number" required><br><br>
        Password:
        <input type="password" id="password" minlength="8"
               required><br><br>
        Course:
        <select required>
            <option value="">Select Course</option>
            <option>Java</option>
            <option>Python</option>
            <option>HTML</option>
        </select><br><br>
        Record File:
        <input type="file" id="record" accept=".pdf" required>
        <br><br>
        <input type="submit" value="Register">
    </form>
    <p id="msg"></p>
    <script src="script.js"></script>
</body>
</html>
